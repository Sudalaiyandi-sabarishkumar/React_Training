<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">⬅ Back</a>
  </nav>

  <div class="details-container">
    <div class="image-side">
      <img id="bookImage" src="" alt="Book cover">
    </div>
    <div class="info-side">
      <h1 id="bookTitle"></h1>
      <p id="bookAuthor"></p>
      <p id="bookCategory"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("bookImage").src = params.get("image");
    document.getElementById("bookTitle").innerText = params.get("title");
    document.getElementById("bookAuthor").innerText = "Author: " + params.get("author");
    document.getElementById("bookCategory").innerText = "Category: " + params.get("category");
  </script>
</body>
</html>
